<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EkoDoc — Recherche</title>
<style>
/*
  Screen: Recherche (surface dédiée)
  Governed by:
  - DESIGN.md § Components: sidebar, search-bar, filter-chip, document-row
  - EXPERIENCE.md § Information Architecture (Recherche row — fulltexte + tag uniquement, pas de filtre type)
  - EXPERIENCE.md § Component Patterns: "Barre de recherche", "Filtres (chips)"
  - EXPERIENCE.md Key Flows: Flow 2, étapes 2-5 (recherche "procédure export compta" + filtre tag Finance)
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #ddd8d0; padding: 32px; }
.browser-frame { max-width: 1280px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid #c9c2b7; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.chrome { background: #EAE6E1; padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #DBD5CD; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #c9c2b7; }
.url { margin-left: 12px; background: #F5F3F0; border: 1px solid #DBD5CD; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #7A7266; }
.app { display: flex; min-height: 560px; background: #F5F3F0; color: #221F1A; }

.sidebar { width: 220px; background: #EAE6E1; border-right: 1px solid #DBD5CD; display: flex; flex-direction: column; padding: 20px 12px; }
.brand { font-size: 14px; font-weight: 600; padding: 0 8px 20px; }
.nav-item { font-size: 14px; padding: 9px 12px; border-radius: 8px; margin-bottom: 2px; }
.nav-item.active { background: #C6FF00; color: #12130A; font-weight: 600; }
.sidebar-spacer { flex: 1; }
.theme-toggle { font-size: 12px; color: #7A7266; padding: 8px 12px; }
.footer { font-size: 14px; color: #7A7266; padding: 4px 12px 0; }

.main { flex: 1; padding: 28px 32px; max-width: 960px; }
h1 { font-size: 28px; font-weight: 600; margin-bottom: 18px; }
.search-bar { display: flex; align-items: center; gap: 10px; background: #F5F3F0; border: 1px solid #DBD5CD; border-radius: 8px; padding: 12px 16px; font-size: 16px; margin-bottom: 14px; }
.search-icon { color: #7A7266; }
.query { color: #221F1A; }
.caret { display: inline-block; width: 1px; height: 18px; background: #221F1A; margin-left: 2px; vertical-align: -3px; }

.filters { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; }
.chip { font-size: 13px; padding: 6px 14px; border-radius: 8px; background: #C6FF00; color: #12130A; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.hint { font-size: 12px; color: #7A7266; }

.result-count { font-size: 13px; color: #7A7266; margin-bottom: 10px; }
.list { border-top: 1px solid #DBD5CD; }
.doc-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #DBD5CD; font-size: 14px; background: #EFEBE6; border-radius: 4px; }
.filetype { font-size: 11px; font-family: monospace; padding: 2px 7px; border-radius: 4px; background: #EAE6E1; color: #7A7266; min-width: 32px; text-align: center; }
.doc-title { flex: 1; font-weight: 500; }
.tag { font-size: 11px; padding: 3px 10px; border-radius: 12px; background: #EAE6E1; color: #221F1A; }
.date { font-size: 12px; color: #7A7266; width: 90px; text-align: right; }
</style>
</head>
<body>
<div class="browser-frame">
  <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">ekodoc.test/recherche</span></div>
  <div class="app">
    <div class="sidebar">
      <div class="brand">EkoDoc</div>
      <div class="nav-item">Bibliothèque</div>
      <div class="nav-item active">Recherche</div>
      <div class="nav-item">Configuration</div>
      <div class="sidebar-spacer"></div>
      <div class="theme-toggle">◐ Thème clair</div>
      <div class="footer">Made with 💔 Claude</div>
    </div>
    <div class="main">
      <h1>Recherche</h1>
      <div class="search-bar"><span class="search-icon">⌕</span><span class="query">procédure export compta</span><span class="caret"></span></div>
      <div class="filters">
        <span class="chip">Tag : Finance ✕</span>
        <span class="hint">Pas de filtre type ici — uniquement fulltexte + tag</span>
      </div>
      <div class="result-count">1 document trouvé</div>
      <div class="list">
        <div class="doc-row"><span class="filetype">PDF</span><span class="doc-title">Procédure export compta.pdf</span><span class="tag">Finance</span><span class="date">31/08/2026</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
